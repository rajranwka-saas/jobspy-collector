services:
  - type: web
    name: jobspy-collector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-job-pipeline.txt && python -m py_compile collector_service.py job_pipeline.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 300 --workers 1 collector_service:app
    healthCheckPath: /
    envVars:
      - key: COLLECTOR_TOKEN
        generateValue: true
      - key: JOB_SITES
        value: indeed,linkedin
      - key: JOB_SEARCH_TERMS
        value: GTM Engineer,Revenue Operations,AI Automation Engineer,RevOps Strategy,RevOps Associate,Demand Generation
      - key: JOB_LOCATIONS
        value: India,Remote
      - key: JOB_COUNTRY_INDEED
        value: India
      - key: JOB_RESULTS_WANTED
        value: "10"
      - key: JOB_HOURS_OLD
        value: "168"
      - key: JOB_MIN_ANNUAL_INR
        value: "420000"
